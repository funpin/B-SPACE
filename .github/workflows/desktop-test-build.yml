name: Desktop Test Build

# Builds the two desktop installers this fork ships (macOS Apple Silicon DMG,
# Windows x64 NSIS) from a branch, for trying a change by hand before it is
# released. Nothing is published: the installers are workflow artifacts, kept
# for 7 days, and the build is unsigned like every release build.
#
# Two ways to start it:
#   - put the `desktop-build` label on a pull request; every new push to it
#     then builds again until the label is taken off;
#   - run it by hand from the Actions tab (or `gh workflow run`), choosing the
#     branch. A manual run needs this file on the default branch.
#
# release.yml stays the only workflow that publishes. This one mirrors its
# build steps (same runners, Node and pnpm) with `--publish never`.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: desktop-test-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-build')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64
            artifact: dist-electron/*.dmg
          # windows-2022 for the same reason as in release.yml: node-gyp in
          # electron-rebuild cannot detect the VS "18" on windows-latest.
          - os: windows-2022
            args: --win --x64
            artifact: dist-electron/*.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @backspace/shared build

      - name: Compile desktop TypeScript
        working-directory: packages/desktop
        run: pnpm exec tsc

      - name: Build desktop app
        working-directory: packages/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}-${{ github.sha }}
          path: packages/desktop/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
